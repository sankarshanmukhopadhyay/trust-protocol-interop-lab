schema: interop-evidence-producer-registry/v1
version: 1
producers:
  - id: composed-unlinkability-v1
    repository: sankarshanmukhopadhyay/trust-protocol-interop-lab
    mode: registered-executable
    evidence_classes:
      - runtime-upstream-observation
    requirement_ids:
      - ER-REL-DID-AB
      - ER-STATUS-AB
      - ER-TASK-AB
      - ER-VERIFIER-AB
      - ER-CREDENTIAL-ID-AB
      - ER-DEVICE-METADATA-AB
    experiment_kind: unlinkability-pressure-case
    observer_model_required: true
    source_pins_required: true
    output_schema: interop-evidence-package/v1
    entrypoints:
      device-metadata-observer:
        path: experiments/device-metadata-observer-ab/run.py
        satisfies: [ER-DEVICE-METADATA-AB]
      relationship-composed-unlinkability:
        capability_status: registered-needs-adapter
        satisfies: [ER-REL-DID-AB, ER-STATUS-AB, ER-TASK-AB, ER-VERIFIER-AB]
      credential-identifier:
        capability_status: registered-needs-adapter
        satisfies: [ER-CREDENTIAL-ID-AB]
