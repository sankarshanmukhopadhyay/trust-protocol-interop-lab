rules:
  - do not raise an upstream defect merely because an ARA requirement is composition-dependent
  - do not turn not-yet-evidenced into unsupported by design
  - upstream feedback requires execution evidence showing a stable semantic need or mismatch
  - adapter-only and substitution-gap states are explicit non-conformance boundaries
