version: 1
case_id: IC-ARA-REL-001
captured_at: 2026-08-28
purpose: distinguish implementation work from unresolved semantic/upstream ownership questions

classes:
  implementation-gap: required behavior is sufficiently understood for the Lab to implement without assigning new upstream semantics
  composition-gap: behavior belongs to the ARA conjunction and needs executable evidence before any normative ownership proposal
  upstream-semantic-gap: pinned upstream sources do not currently provide a directly attributable semantic contract needed by the ARA proposal
  substitution-gap: local adapter can exercise the boundary but standards-native replacement evidence is missing
  assurance-gap: implementation may exist but evidence/pressure testing is insufficient for the claimed maturity

gaps:
  - id: ARA-GAP-001
    class: implementation-gap
    surface: Role Record state engine
    description: No executable ARA local Role Record with previous-head/current-head, rollback/fork detection and append-only correction exists.
    owner_now: Interop Lab experimental implementation
    next_issue: 35
    upstream_issue_warranted: false

  - id: ARA-GAP-002
    class: upstream-semantic-gap
    surface: Agreement Object
    description: No pinned source directly owns the exact immutable/versioned agreement proposal/acceptance/activation contract required by the minimum ARA ceremony.
    owner_now: ARA-local experimental contract
    next_issue: 36
    upstream_issue_warranted: false
    reason: first obtain executable evidence showing which agreement semantics are actually necessary

  - id: ARA-GAP-003
    class: composition-gap
    surface: instance-governance authorization conjunction
    description: Existing authority, policy, task, capability and evidence semantics exist separately, but no source owns the complete ARA conjunction over current relationship/agreement state.
    owner_now: Interop Lab composition
    next_issue: 36
    upstream_issue_warranted: false

  - id: ARA-GAP-004
