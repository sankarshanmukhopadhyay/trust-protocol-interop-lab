version: 1
case_id: IC-ARA-REL-001
status: pre-admission
promotion_ready: false
principles:
  - green repository assurance is necessary but not sufficient
  - documentation intent does not satisfy an executable evidence gate
  - missing evidence remains indeterminate or not-started
  - adapter-backed evidence must not be relabeled as standards-native conformance
  - each gate is independently attributable

summary:
  satisfied: 3
  partially_satisfied: 0
  blocked: 0
  not_started: 9

gates:
  - id: ARA-G1-SEMANTIC-OWNERSHIP
    mandatory: true
    status: satisfied
    question: Are minimum ARA objects, boundaries, non-implication rules, and falsification vectors explicitly defined without silently claiming upstream ownership?
    evidence:
      - cases/ara-minimum-executable-relationship/README.md
      - cases/ara-minimum-executable-relationship/ownership.yaml
      - cases/ara-minimum-executable-relationship/invariants.yaml
      - cases/ara-minimum-executable-relationship/vectors.yaml
      - cases/ara-minimum-executable-relationship/judgment-log.md
    resolved_gap: pre-code semantic boundaries and falsification contract established
    next_action: preserve these boundaries while implementing the pinned reuse plan

  - id: ARA-G2-BASELINES-PINNED
    mandatory: true
    status: satisfied
    question: Are all reused upstream/local experimental components pinned to immutable baselines with explicit semantic mapping status?
    evidence:
      - cases/ara-minimum-executable-relationship/baselines.yaml
      - cases/ara-minimum-executable-relationship/reuse-mapping.yaml
      - cases/ara-minimum-executable-relationship/reuse-matrix.md
      - cases/ara-minimum-executable-relationship/gap-register.yaml
      - cases/ara-minimum-executable-relationship/adapter-plan.md
      - cases/ara-minimum-executable-relationship/judgment-log.md
    resolved_gap: >-
      phase 2 pins exact inspected baselines and classifies every minimum-slice requirement as
      direct, composition-dependent, adapter-only, candidate, or not-yet-evidenced; unresolved
      Agreement Object and collective-knowledge semantics remain explicit rather than assigned
      to a nearby component
    next_action: preserve exact source ownership while implementing local composition semantics

  - id: ARA-G3-ROLE-STATE-EXECUTABLE
    mandatory: true
    status: satisfied
    question: Can persistent Agent Role/Role Record state advance, survive Live Agent replacement, and reject stale/rollback/fork transitions?
    evidence:
      - experiments/ara-role-record/engine.py
      - experiments/ara-role-record/run.py
      - experiments/ara-role-record/README.md
      - .github/workflows/ci.yml
    resolved_gap: >-
      a deterministic Lab-local hash-linked Role Record engine now persists relationship-local
      state across engine/Live Agent replacement, binds updates to the current head and an
      authorized Workflow class, emits machine-readable receipts, preserves evidence visibility
      classes, and rejects unauthorized, missing-head, stale/rollback, replay, fork, hidden-session,
      mutation, deletion, and persisted-head rollback vectors
    limitations: >-
      evidence is bounded to Lab-local state semantics and does not establish KERI, BetterSign,
      OpenVTC VTA, transparency-log, hardware anti-rollback, Byzantine consensus, or production
      persistence/security conformance
    next_action: issue 36 — build the Agreement Object, deterministic Policy Gate, Trust Task, capability and execution-admission spine on the proven current-head substrate

  - id: ARA-G4-POLICY-TASK-CAPABILITY
