rules:
  - pinning a baseline does not establish semantic ownership
  - local specifications and implementations are not represented as ToIP normative text
  - Lab cases are evidence about bounded compositions, not certification of their inputs
  - assurance evidence cannot authorize a runtime action
  - where a requirement has no attributable owner, the mapping remains candidate, adapter-only, composition-dependent, or not-yet-evidenced
