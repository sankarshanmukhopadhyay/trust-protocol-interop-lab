version: 1
case_id: IC-ARA-REL-001
captured_at: 2026-08-28
purpose: >-
  Immutable baseline register for ARA Phase 2. A pinned baseline is evidence of what was
  inspected and reused; it is not evidence that the source owns an ARA semantic merely
  because it contains a nearby concept.

baseline_classes:
  upstream-normative: source owned by an upstream standards/specification project
  upstream-implementation: implementation source owned by an upstream project
  local-specification: locally maintained specification or candidate specification
  local-implementation: locally maintained implementation/profile artifact
  lab-evidence: repository-owned experimental composition/evidence
  assurance-evidence: assurance or privacy evidence used only within its declared scope

