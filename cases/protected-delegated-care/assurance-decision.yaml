case_id: IC-PDC-MED-001
decision_id: PDC-ASSURANCE-2026-09-06
issue: 138
decision: remain_experimental
promotion_to_candidate: false
workflow_green: true
assurance_green: false
reason: >-
  The executable case, Trust Task binding, current-authority boundary, runtime privacy evidence,
  selective-disclosure refill comparison, and prescription-to-refill lifecycle are reproducible,
  but material assurance questions remain unresolved or INDETERMINATE at upstream/runtime boundaries.
