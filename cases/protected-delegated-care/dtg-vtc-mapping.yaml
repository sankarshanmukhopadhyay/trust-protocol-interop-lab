case_id: IC-PDC-MED-001
purpose: >-
  Record expected trust-stack consumption without converting case-local application
  semantics into upstream normative claims.
reference_baselines:
  trust_tasks: "trustoverip/dtgwg-trust-tasks-spec @ 7c6e1bd4e1585cbf1a6363bd3cbf9059e90a335c"
  dtg_credentials: "DTG Core Credentials @ 344a66af868c192f15b511e7116ccab2039221de (existing Lab reference baseline)"
  vtc_runtime: "OpenVTC/openvtc @ f93bc7e58f2766f3064e2b23ef877563069609ac"
mappings:
  - requirement: identify principal and delegate without treating identity as authority
    expected_surface: dtg_credentials
    status: candidate
    evidence_needed: exact credential/proof objects and verification trace

  - requirement: represent care relationship separately from delegated action authority
    expected_surface: dtg_relationship_and_credential_semantics
    status: unresolved
    evidence_needed: pin exact current relationship representation and prove non-collapse with delegation

  - requirement: bind requester, principal, action, resource, context and expiry into a consequential request
    expected_surface: trust_tasks
    status: adapter_seam
    evidence_available:
      - cases/protected-delegated-care/trust-task-profile.yaml
      - experiments/protected-delegated-care/run_trust_task_binding.py
    evidence_needed: >-
      Exercise the profile against an actual VTC dispatcher and resolve the current
      document-proof versus authenticated-transport boundary before any generic
      Trust Tasks conformance claim.

  - requirement: re-evaluate current authority at execution time
    expected_surface: vtc_authorization_lifecycle
    status: adapter_seam
    evidence_needed: identify and exercise an actual VTC/OpenVTC current-authority evaluation surface and execute revoked-task race

  - requirement: propagate delegation revocation into later action denial
    expected_surface: dtg_vtc_lifecycle
    status: unresolved
    evidence_needed: observed revocation/status semantics across the chosen implementation path

  - requirement: enforce minimum disclosure at caregiver and channel boundaries
    expected_surface: application_profile_plus_dpip
    status: application_profile
    evidence_needed: disclosure-policy execution trace; later DPIP observation fixtures

  - requirement: pharmacy refill selective disclosure or unlinkable proof
    expected_surface: dtg_zkp_or_selective_disclosure
    status: deferred
    evidence_needed: separate follow-on case IC-PDC-REFILL-001 or equivalent

observed_integration_boundaries:
  - id: PDC-DTG-BND-001
    topic: Trust Task document proof vs OpenVTC authenticated transport
    observation: >-
      The pinned Trust Tasks specification models proof as a framework member and
      its current examples verify proof against issuer. The pinned OpenVTC code
      constructs the same Trust Task document for DIDComm/TSP and documents
      DIDComm flows where authcrypt sender authentication replaces a separate
      document-level holder proof.
    classification: unresolved
    rule: >-
      A PDC document without proof may be described only as an
      OpenVTC-transport-bound candidate until this boundary is reconciled and
      exercised. It MUST NOT be described as generic Trust Tasks conformance.

classification_values:
  direct: existing implementation surface used without case-local semantic substitution
  candidate: plausible mapping requiring executable evidence before claim
  application_profile: intentionally owned by PDC rather than upstream
  adapter_seam: explicit temporary boundary standing in for an incomplete or unexercised implementation surface
  unresolved: required semantic mapping has not yet been established
  deferred: outside IC-PDC-MED-001 initial claim boundary

rules:
  - A candidate or adapter mapping MUST NOT be reported as upstream conformance.
  - An unresolved mapping MUST remain visible and MUST NOT be converted into PASS.
  - A case-local workaround MUST be recorded in gaps.yaml before use.
  - Protocol changes MUST NOT be proposed merely to make the case pass; first classify the observed mismatch.
