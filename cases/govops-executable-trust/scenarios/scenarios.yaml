        "policy_decision": "allow",
        "decision_enforced": true,
        "effect_decision_match": true,
        "effect_capability_match": true,
        "policy_store_id": "loan-policy-store",
        "policy_store_version": "17"
      },
      "expected": {
        "execution_state": "admitted",
        "enforcement_state": "enforced",
        "effect_state": "observed",
        "evidence_state": "complete",
        "assurance_state": "not_evaluated"
      },
      "invariants": ["INV-GOVOPS-001", "INV-GOVOPS-002", "INV-GOVOPS-003", "INV-GOVOPS-005", "INV-GOVOPS-006", "INV-GOVOPS-007", "INV-GOVOPS-011", "INV-GOVOPS-012"]
    },
