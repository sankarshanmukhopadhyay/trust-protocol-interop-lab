propositions: [DTG-371-P10, DTG-371-P13]
rule: >-
  Common-control or same-subject semantics must be established by evidence that proves
  the required linkage in the current context. Identifier association, possession of
  individually valid component credentials, or proof of control over only one identifier
  does not establish control of another identifier or a reusable subject equivalence.
