version: "0.1"
case: IC-DTG-PROTECTED-ACCESS-001
status: pre-admission
mapping_states:
  direct-mapping: "The case concept is directly represented by an attributable baseline artifact or field."
  candidate-mapping: "A plausible baseline artifact contributes to the concept, but the composed semantics still require execution evidence."
  not-yet-evidenced: "No sufficiently attributable mapping has been established; this is not an upstream defect finding."
mappings:
  - concept: protected_relationship_evidence
    mapping_state: direct-mapping
    baseline: dtg-credentials
    artifact: "VRC/VWC edge evidence, including required VWC digest binding to the referenced VRC"
    contributes_to: [BC-AUTH-PROVENANCE]
    caveat: "Edge evidence can establish attributable relationship evidence; it does not by itself establish current entitlement, disclosure permission or relying-party authorization."
  - concept: eligible
    mapping_state: candidate-mapping
    baselines: [dtg-credentials, dtg-trust-tasks, dtg-zkp-local-fork]
    artifact: "predicate derived from credential/relationship evidence and proven in the composed presentation"
    contributes_to: [BC-MINIMUM-DISCLOSURE]
    caveat: "No claim is made that the current upstream credential specification defines a universal `eligible` predicate. The case defines the predicate locally for the bounded experiment."
  - concept: provider_class_authorised
    mapping_state: candidate-mapping
    baselines: [dtg-credentials, dtg-trust-tasks]
    artifact: "authority/provenance evidence sufficient to establish an authorised provider class without requiring provider identity disclosure"
    contributes_to: [BC-AUTH-PROVENANCE, BC-MINIMUM-DISCLOSURE]
    caveat: "The exact authority source and proof construction remain to be instantiated."
  - concept: proof_context_valid
    mapping_state: candidate-mapping
    baselines: [dtg-trust-tasks, dtg-zkp-local-fork]
    artifact: "verifier, purpose, challenge and transaction/task context binding"
    contributes_to: [BC-REPLAY-RESISTANCE]
    caveat: "The evaluator must validate current context independently of original proof validity."
  - concept: protected_provider_identity
    mapping_state: candidate-mapping
    baselines: [dtg-credentials, dtg-trust-tasks]
    artifact: "issuer, subject, edge, task, endpoint or other metadata capable of exposing provider identity"
    contributes_to: [BC-MINIMUM-DISCLOSURE, BC-NON-DISCOVERABILITY]
    caveat: "Absence from disclosed credential claims is insufficient; all observable metadata surfaces must be inspected."
  - concept: protected_provider_location
    mapping_state: not-yet-evidenced
    artifact: "deployment, service, endpoint or auxiliary metadata that could reveal physical location"
    contributes_to: [BC-MINIMUM-DISCLOSURE, BC-NON-DISCOVERABILITY]
    caveat: "No current DTG artifact is assumed to encode location. The evaluator must nevertheless detect location leakage if a fixture or implementation exposes it."
  - concept: case_identifier
    mapping_state: candidate-mapping
    baselines: [dtg-trust-tasks, dtg-credentials]
    artifact: "task/thread/context identifiers or application-specific case identifiers"
    contributes_to: [BC-CORRELATION-RESISTANCE]
    caveat: "A legitimate local correlation key can still be a privacy failure when exposed across relying contexts."
  - concept: durable_subject_identifier
    mapping_state: candidate-mapping
    baselines: [dtg-credentials, dtg-trust-tasks, dtg-zkp-local-fork]
    artifact: "subject identifier, presentation identifier or stable derived handle observable across contexts"
    contributes_to: [BC-CORRELATION-RESISTANCE]
    caveat: "Selective disclosure alone does not establish unlinkability."
  - concept: durable_provider_identifier
    mapping_state: candidate-mapping
    baselines: [dtg-credentials, dtg-trust-tasks]
    artifact: "issuer/provider/task metadata stable across presentations"
    contributes_to: [BC-NON-DISCOVERABILITY, BC-CORRELATION-RESISTANCE]
    caveat: "The evaluator must compare observable artifacts across vectors/contexts."
  - concept: composed_privacy_result
    mapping_state: direct-mapping
    baseline: dpip
    artifact: "DPIP interaction/result evidence for minimum disclosure, correlation scope and privacy invariants"
    contributes_to: [BC-MINIMUM-DISCLOSURE, BC-NON-DISCOVERABILITY, BC-CORRELATION-RESISTANCE]
    caveat: "The exact DPIP fixture/profile binding is the next implementation step."
