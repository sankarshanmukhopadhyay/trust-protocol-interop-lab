version: 2
case: IC-DTG-PROTECTED-ACCESS-001
purpose: >-
  Define provenance-bound A/B runtime evidence packages that the Interop Lab may
  produce for DPIP. Runtime evidence must distinguish deliberately seeded correlation
  controls from context-distinct unlinkability pressure cases, and must distinguish an
  executed surface with no value from a subsystem that was not executed.

experiment_kinds:
  positive-control:
    expected_join: must-detect
    meaning: A deliberately seeded correlator validates detector sensitivity and is not by itself a target privacy failure.
  unlinkability-pressure-case:
    expected_join: must-not-emerge
    meaning: A and B start context-distinct; any newly observed stable join requires origin/attribution before interpretation.

correlator_origins:
  - fixture-supplied
  - target-derived
  - composition-derived
  - retained
  - observer-derived
  - none
  - unknown

contexts:
  A:
    title: Relying context A
    summary: First independently observable relying context.
  B:
    title: Relying context B
    summary: Second independently observable relying context used for A/B comparison.

requirements:
  ER-REL-DID-AB:
    title: Cross-context relationship identifier observations
    summary: Observe relationship DIDs, edge identifiers and equivalent relationship binders across A/B.
    source_issue: "RAHP #137"
    surfaces: [relationship_did, edge_identifier, equivalent_relationship_binder]
  ER-STATUS-AB:
    title: Cross-context status and policy-discovery observations
    summary: Observe materially executed status-query and policy-discovery surfaces across A/B.
    source_issue: "RAHP #138"
    surfaces: [status_handle, status_endpoint, policy_discovery_handle, policy_endpoint]
  ER-TASK-AB:
    title: Cross-context retained Trust Task evidence observations
    summary: Observe materially executed Trust Task and retained relationship/outcome surfaces across A/B.
    source_issue: "RAHP #139"
    surfaces: [task_identifier, thread_identifier, retained_relationship_evidence, retained_outcome_evidence]
  ER-VERIFIER-AB:
    title: Verifier transcript and deliberate-correlation observations
    summary: Capture A/B verifier transcripts and join attempts while preserving whether correlation was seeded or discovered.
    source_issue: "RAHP #140"
    surfaces: [verifier_transcript, challenge, purpose, transaction_context, deliberate_join_attempt]

classification_values:
  - identical
  - derivably-related
  - fresh
  - absent
  - not-evidenced

execution_states:
  executed: The producing subsystem ran for this context.
  not-executed: No runtime conclusion may be drawn for this surface.

required_provenance:
  - producer
  - run_id
  - observed_at
  - implementation_repository
  - implementation_revision
  - context_a_run
  - context_b_run

assurance_boundary: >-
  Export validity proves evidence-package structure, execution state and attribution.
  It does not establish privacy PASS or universal unlinkability. A positive-control join
  is expected evidence about detector sensitivity. DPIP owns scoped interpretation.