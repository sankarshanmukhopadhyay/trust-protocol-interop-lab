assurance_boundary: >-
  This executes only the public target-native ticket issuance/URI surface. Manifest discovery,
  directory/profile lookup, grant-status network observation and application/profile retention
  are deliberately left not-evidenced unless independently executed. Fresh ticket fingerprints
  do not establish universal vetted-admission unlinkability. Detector positive/negative controls
  are synthetic sensitivity checks using the same classifier and are not upstream target evidence.
