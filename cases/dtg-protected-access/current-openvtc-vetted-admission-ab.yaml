assurance_boundary: >-
  This target-native probe exercises all five DPIP vetted-admission evidence families at the
  pinned OpenVTC epoch. Status execution is bounded to target-native status URL validation;
  it does not claim a live external status-list fetch. Directory evidence covers client-side
  request/filter/profile metadata and transient query retention; it does not infer server-side
  directory persistence. Retention evidence covers the target client's application/profile
  state after a refusal transition. No raw ticket secret, personal claim, location/contact
  value or full profile content is exported. No result establishes universal unlinkability or PASS.
