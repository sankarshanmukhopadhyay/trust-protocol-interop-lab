    - provider_class_authorised
    - authority_provenance_class
    - protected_provider_identity
    - protected_provider_location
    - protected_relationship_type
    - case_identifier
    - durable_subject_identifier
    - durable_provider_identifier
claim_boundary:
  proves:
    - real BBS signature generation and derived-proof verification
    - selective disclosure of signed messages
    - crypto-pass plus privacy-fail behavior for PA-NEG-001
    - replay failure when BBS presentationHeader changes for PA-ADV-001
  does_not_prove:
    - full W3C Data Integrity bbs-2023 processing or conformance
    - upstream DTG credential/VRC/VWC realization of the case-local eligibility predicate
    - Trust Task wire interoperability
    - private status or registry resolution
    - DPIP-native execution
    - production deployment security
