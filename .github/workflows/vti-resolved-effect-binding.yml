name: Current VTI resolved-effect binding

on:
  pull_request:
    paths:
      - '.github/workflows/vti-resolved-effect-binding.yml'
      - 'experiments/vti-resolved-effect-binding/evaluate.py'
      - 'tests/test_vti_resolved_effect_binding.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VTI_REVISION: 8541848176ec9707e24b24f57b09eb9650935a95
      VTI_CHECKOUT: ${{ github.workspace }}/build/current-vti
    steps:
      - name: Checkout Interop Lab
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install native target dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - name: Checkout immutable current VTI target
        uses: actions/checkout@v7
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: ${{ env.VTI_REVISION }}
          path: build/current-vti
          fetch-depth: 1
      - name: Verify target pin
        run: |
          set -euo pipefail
          test "$(git -C "$VTI_CHECKOUT" rev-parse HEAD)" = "$VTI_REVISION"
          test -z "$(git -C "$VTI_CHECKOUT" status --porcelain)"
      - name: Execute owning VTI package tests
        run: cargo test --manifest-path "$VTI_CHECKOUT/Cargo.toml" -p vta-service --lib
      - name: Characterize resolved-effect boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path

          target = Path(os.environ['VTI_CHECKOUT'])
          source = (target / 'vta-service/src/trust_tasks/vault.rs').read_text(encoding='utf-8')
          observations = {
              'vault_write_gate': 'Capability::VaultWrite' in source,
              'context_scope_gate': 'enforce_context_scope(auth, Some(&existing.entry.context_id)' in source,
              'version_gate': 'check_expected_version(&doc, "delete"' in source,
              'force_hard_delete': 'if req.force' in source and 'delete_vault_entry(&state.vault_ks, &req.id)' in source,
              'soft_delete_grace': 'soft_delete(&now_str, &grace_until' in source and 'vault.grace_days' in source,
              'audit_declared': 'audit row (action `vault.delete`' in source,
              'target_package_tests': 'passed',
              'runtime_branch_test': False,
              'approval_surface_observed': False,
          }
          module_path = Path(os.environ['GITHUB_WORKSPACE']) / 'experiments/vti-resolved-effect-binding/evaluate.py'
          spec = importlib.util.spec_from_file_location('vti_resolved_effect', module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.evaluate(observations, os.environ['VTI_REVISION'])
          out = Path(os.environ['RUNNER_TEMP']) / 'vti-resolved-effect-binding.json'
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          assert result['evidence_maturity'] == 'SOURCE_PINNED_EFFECT_BINDING_EVIDENCE'
          assert result['f004_retained_agency'] == 'EVIDENCE_REQUIRED'
          PY
      - name: Run Interop characterization tests
        run: python -m unittest tests.test_vti_resolved_effect_binding
      - name: Capture target drift and restore immutable checkout
        run: |
          set -euo pipefail
          git -C "$VTI_CHECKOUT" status --porcelain=v1 --untracked-files=all | tee "${{ runner.temp }}/vti-runtime-drift.txt"
          git -C "$VTI_CHECKOUT" reset --hard "$VTI_REVISION"
          git -C "$VTI_CHECKOUT" clean -fdx
      - name: Upload attributable evidence
        uses: actions/upload-artifact@v7
        with:
          name: current-vti-resolved-effect-binding
          path: |
            ${{ runner.temp }}/vti-resolved-effect-binding.json
            ${{ runner.temp }}/vti-runtime-drift.txt
          if-no-files-found: error
