name: Repository assurance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Validate interoperability cases
        run: python scripts/validate_cases.py

      - name: Validate evidence
        run: python scripts/validate_evidence.py

      - name: Validate core standards intelligence
        run: python scripts/validate_standards.py

      - name: Validate standards corpus v2
        run: python scripts/validate_standards_v2.py

      - name: Run executable cross-spec tests
        run: |
          python experiments/xsp-001/run.py
          python experiments/xsp-002/run.py
          python experiments/arpa-a2a-anab/run.py
          python experiments/dtg-protected-access/run.py --check

      - name: Run ARA Role Record state evidence
        run: python experiments/ara-role-record/run.py --check

      - name: Run ARA policy-task-capability evidence
        run: python experiments/ara-policy-spine/run.py --check

      - name: Run ARA protected-signing evidence
        run: python experiments/ara-protected-signing/run.py --check

      - name: Run ARA independent-counterparty evidence
        run: python experiments/ara-independent-counterparty/run.py --check

      - name: Run ARA distributed-VRR evidence
        run: python experiments/ara-distributed-vrr/run.py --check

      - name: Set up Node for BBS evidence
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install BBS construction dependency
        working-directory: experiments/dtg-protected-access-bbs
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Run protected-access BBS construction evidence
        run: node experiments/dtg-protected-access-bbs/run.mjs --output-dir "${{ runner.temp }}/protected-access-bbs"

      - name: Upload protected-access BBS evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-access-bbs-evidence
          path: ${{ runner.temp }}/protected-access-bbs/
          if-no-files-found: error

      - name: Remove transient BBS dependencies
        run: rm -rf experiments/dtg-protected-access-bbs/node_modules

      - name: Regenerate deterministic outputs
        run: |
          python scripts/generate_standards.py
          python scripts/generate_readiness.py

      - name: Upload regenerated standards views
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regenerated-standards
          path: standards/generated/
          if-no-files-found: error

      - name: Check generated tree is clean
        run: git diff --exit-code

      - name: Check repository links
        run: python scripts/check_links.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build GitHub Pages site
        run: bundle exec jekyll build
