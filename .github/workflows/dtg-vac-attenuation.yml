name: DTG VAC attenuation evidence

on:
  pull_request:
    paths:
      - 'cases/dtg-vac-attenuation/**'
      - 'experiments/dtg-vac-attenuation/**'
      - 'results/dtg-vac-attenuation/**'
      - '.github/workflows/dtg-vac-attenuation.yml'
  push:
    branches: [main]
    paths:
      - 'cases/dtg-vac-attenuation/**'
      - 'experiments/dtg-vac-attenuation/**'
      - 'results/dtg-vac-attenuation/**'
      - '.github/workflows/dtg-vac-attenuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Execute VAC attenuation vectors
        run: python experiments/dtg-vac-attenuation/run.py --check
