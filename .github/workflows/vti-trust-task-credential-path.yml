name: Current VTI Trust Task credential path

on:
  pull_request:
    paths:
      - '.github/workflows/vti-trust-task-credential-path.yml'
      - 'experiments/vti-trust-task-credential-path/evaluate.py'
      - 'tests/test_vti_trust_task_credential_path.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vti-trust-task-credential-path.yml'
      - 'experiments/vti-trust-task-credential-path/evaluate.py'
      - 'tests/test_vti_trust_task_credential_path.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VTI_REVISION: 1d9d3672c4a538c84b8263229619ae3bb4342b26
      VTI_CHECKOUT: ${{ github.workspace }}/build/current-vti
    steps:
      - name: Checkout Interop Lab
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install native target dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - name: Checkout immutable current VTI target
        uses: actions/checkout@v7
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: ${{ env.VTI_REVISION }}
          path: build/current-vti
          fetch-depth: 1
      - name: Verify immutable target pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$VTI_CHECKOUT" rev-parse HEAD)" = "$VTI_REVISION"
          test -z "$(git -C "$VTI_CHECKOUT" status --porcelain)"
      - name: Execute owning VTI package tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "$VTI_CHECKOUT/Cargo.toml" -p vta-service --lib
      - name: Characterize integrated Trust Task credential boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path

          target = Path(os.environ['VTI_CHECKOUT'])
          source = (target / 'vta-service/src/trust_tasks/room_owner.rs').read_text(encoding='utf-8')
          observations = {
              'trust_task_type': 'TrustTask<Value>' in source,
              'credential_write_gate': 'Capability::CredentialWrite' in source,
              'independent_signing_context': 'signing_context(state, auth)' in source and 'sign_as_room' in source,
              'vac_constructor': 'DTGCredential::new_vac' in source,
              'empty_actions_fail_closed': 'refuses an empty' in source and 'AppError::Validation' in source,
              'credential_response': 'credentialId' in source and 'serialized' not in source,
              'target_package_tests': 'passed',
              'behavior_test_present': False,
          }
          # The response spelling in source is British-English `serialised`; prove actual field construction separately.
          observations['credential_response'] = '"credential"' in source and '"credentialId"' in source and 'serialised' in source
          module_path = Path(os.environ['GITHUB_WORKSPACE']) / 'experiments/vti-trust-task-credential-path/evaluate.py'
          spec = importlib.util.spec_from_file_location('vti_tt_credential', module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.evaluate(observations, os.environ['VTI_REVISION'])
          out = Path(os.environ['RUNNER_TEMP']) / 'vti-trust-task-credential-path.json'
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          assert result['evidence_maturity'] == 'SOURCE_PINNED_INTEGRATION_EVIDENCE'
          assert result['r001'] == 'PARTIALLY_DISCHARGED'
          assert result['r002'] == 'PARTIALLY_DISCHARGED'
          assert 'behavioral target-native test' in result['remaining_gap']
          PY
      - name: Run Interop characterization tests
        run: python -m unittest tests.test_vti_trust_task_credential_path
      - name: Capture target runtime drift and restore immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          git -C "$VTI_CHECKOUT" status --porcelain=v1 --untracked-files=all | tee "${{ runner.temp }}/vti-runtime-drift.txt"
          git -C "$VTI_CHECKOUT" reset --hard "$VTI_REVISION"
          git -C "$VTI_CHECKOUT" clean -fdx
      - name: Verify immutable target after execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$VTI_CHECKOUT" rev-parse HEAD)" = "$VTI_REVISION"
          test -z "$(git -C "$VTI_CHECKOUT" status --porcelain --untracked-files=all)"
      - name: Upload attributable evidence
        uses: actions/upload-artifact@v7
        with:
          name: current-vti-trust-task-credential-boundary
          path: |
            ${{ runner.temp }}/vti-trust-task-credential-path.json
            ${{ runner.temp }}/vti-runtime-drift.txt
          if-no-files-found: error
