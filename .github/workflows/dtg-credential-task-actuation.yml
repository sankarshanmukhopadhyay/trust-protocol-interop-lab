name: DTG credential to Trust Task actuation evidence

on:
  pull_request:
    paths:
      - '.github/workflows/dtg-credential-task-actuation.yml'
      - 'cases/dtg-credential-task-actuation/**'
      - 'experiments/dtg-credential-task-actuation/**'
      - 'experiments/dtg-vdc-vac-composition/**'
      - 'experiments/protected-delegated-care/**'
      - 'tests/test_credential_task_actuation.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install evidence dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Execute issue 163 evidence producer
        run: python experiments/dtg-credential-task-actuation/run.py > "${{ runner.temp }}/credential-task-actuation.json"
      - name: Validate evidence contract
        run: python -m unittest tests.test_credential_task_actuation
      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v7
        with:
          name: credential-task-actuation-evidence
          path: ${{ runner.temp }}/credential-task-actuation.json
          if-no-files-found: error
