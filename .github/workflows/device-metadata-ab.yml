name: Device metadata A-B runtime evidence

on:
  pull_request:
    paths:
      - 'experiments/device-metadata-ab/**'
      - '.github/workflows/device-metadata-ab.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/device-metadata-ab/**'
      - '.github/workflows/device-metadata-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENVTC_REVISION: 2aa7ce3f8d1397048f13b85dffc3da6e10667a15
      VTI_REVISION: 96304b3b6ae76995e094e575560d74a43ee95e51
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Checkout pinned OpenVTC
        run: |
          git clone --filter=blob:none https://github.com/OpenVTC/openvtc.git "$RUNNER_TEMP/openvtc"
          git -C "$RUNNER_TEMP/openvtc" checkout --detach "$OPENVTC_REVISION"
          test "$(git -C "$RUNNER_TEMP/openvtc" rev-parse HEAD)" = "$OPENVTC_REVISION"
      - name: Checkout pinned VTI
        run: |
          git clone --filter=blob:none https://github.com/OpenVTC/verifiable-trust-infrastructure.git "$RUNNER_TEMP/vti"
          git -C "$RUNNER_TEMP/vti" checkout --detach "$VTI_REVISION"
          test "$(git -C "$RUNNER_TEMP/vti" rev-parse HEAD)" = "$VTI_REVISION"
      - name: Execute A-B runtime probe
        run: |
          python experiments/device-metadata-ab/run.py \
            --openvtc "$RUNNER_TEMP/openvtc" \
            --vti "$RUNNER_TEMP/vti" \
            --openvtc-revision "$OPENVTC_REVISION" \
            --vti-revision "$VTI_REVISION" \
            --run-id "github-${GITHUB_RUN_ID}" \
            --output "$RUNNER_TEMP/device-metadata-ab/evidence.json"
      - name: Upload attributable evidence
        uses: actions/upload-artifact@v4
        with:
          name: device-metadata-ab-evidence
          path: ${{ runner.temp }}/device-metadata-ab/evidence.json
          if-no-files-found: error
