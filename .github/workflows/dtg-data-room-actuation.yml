name: DTG Data Room actuation evidence

on:
  pull_request:
    paths:
      - 'cases/dtg-data-room-actuation/**'
      - 'experiments/dtg-data-room-actuation/**'
      - 'results/dtg-data-room-actuation/**'
      - '.github/workflows/dtg-data-room-actuation.yml'
  push:
    branches: [main]
    paths:
      - 'cases/dtg-data-room-actuation/**'
      - 'experiments/dtg-data-room-actuation/**'
      - 'results/dtg-data-room-actuation/**'
      - '.github/workflows/dtg-data-room-actuation.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python experiments/dtg-data-room-actuation/run.py --check
