name: Current VTI credential replay convergence

on:
  pull_request:
    paths:
      - '.github/workflows/vti-credential-replay-convergence.yml'
      - 'experiments/vti-credential-replay-convergence/evaluate.py'
      - 'tests/test_vti_credential_replay_convergence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VTI_REVISION: 8541848176ec9707e24b24f57b09eb9650935a95
      VTI_CHECKOUT: ${{ github.workspace }}/build/current-vti
    steps:
      - name: Checkout Interop Lab
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install native target dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - name: Checkout immutable current VTI target
        uses: actions/checkout@v7
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: ${{ env.VTI_REVISION }}
          path: build/current-vti
          fetch-depth: 1
      - name: Verify target pin
        run: |
          test "$(git -C "$VTI_CHECKOUT" rev-parse HEAD)" = "$VTI_REVISION"
          test -z "$(git -C "$VTI_CHECKOUT" status --porcelain)"
      - name: Execute owning VTI package tests
        run: cargo test --manifest-path "$VTI_CHECKOUT/Cargo.toml" -p vta-service --lib
      - name: Characterize credential replay convergence
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          root = Path(os.environ['VTI_CHECKOUT'])
          idem = (root / 'vta-service/src/trust_tasks/idempotency.rs').read_text()
          mod = (root / 'vta-service/src/trust_tasks/mod.rs').read_text()
          retry = (root / 'vta-sdk/src/retry_safety.rs').read_text()
          observations = {
            'issue_authority_keyed': 'TASK_ROOMS_OWNER_ISSUE_AUTHORITY_0_2, Keyed' in retry,
            'signed_idempotency_key': 'Data-Integrity proof covers every' in idem and 'IDEMPOTENCY_KEY_MEMBER' in idem,
            'actor_key_payload_binding': 'Principal::Did(actor.to_string()).hash()' in idem and 'payload_hash(doc)' in idem,
            'conflict_fails_closed': 'ClaimOutcome::Conflict' in idem and 'idempotency key reused for a different request' in idem,
            'completed_response_replayed': 'ClaimOutcome::Completed(entry)' in idem and 'replay(doc, &entry' in idem,
            'failed_outcome_releases_claim': '!outcome.status.is_success()' in idem and 'store.release(&principal, key)' in idem,
            'dispatcher_claims_before_dispatch': 'idempotency::claim' in mod and 'idempotency::Claim::Proceed' in mod,
            'dispatcher_records_after_dispatch': 'idempotency::record_outcome' in mod,
            'target_package_tests': 'passed',
          }
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'experiments/vti-credential-replay-convergence/evaluate.py'
          s = importlib.util.spec_from_file_location('vti_replay', p)
          m = importlib.util.module_from_spec(s); s.loader.exec_module(m)
          result = m.evaluate(observations, os.environ['VTI_REVISION'])
          out = Path(os.environ['RUNNER_TEMP']) / 'vti-credential-replay-convergence.json'
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          assert result['evidence_maturity'] == 'SOURCE_PINNED_REPLAY_CONVERGENCE_EVIDENCE'
          PY
      - name: Run Interop characterization tests
        run: python -m unittest tests.test_vti_credential_replay_convergence
      - name: Capture target drift and restore immutable checkout
        run: |
          git -C "$VTI_CHECKOUT" status --porcelain=v1 --untracked-files=all | tee "${{ runner.temp }}/vti-runtime-drift.txt"
          git -C "$VTI_CHECKOUT" reset --hard "$VTI_REVISION"
          git -C "$VTI_CHECKOUT" clean -fdx
          test -z "$(git -C "$VTI_CHECKOUT" status --porcelain --untracked-files=all)"
      - name: Upload attributable evidence
        uses: actions/upload-artifact@v7
        with:
          name: current-vti-credential-replay-convergence
          path: |
            ${{ runner.temp }}/vti-credential-replay-convergence.json
            ${{ runner.temp }}/vti-runtime-drift.txt
          if-no-files-found: error
