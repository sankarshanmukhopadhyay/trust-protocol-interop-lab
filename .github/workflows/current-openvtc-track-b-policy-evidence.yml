name: Current OpenVTC Track B policy evidence

on:
  pull_request:
    paths:
      - '.github/workflows/current-openvtc-track-b-policy-evidence.yml'
      - 'experiments/dtg-protected-access/current_openvtc_track_b_policy_context.py'
      - 'experiments/dtg-protected-access/capture_ab_runtime.py'
      - 'experiments/dtg-protected-access/export_dpip_evidence.py'
      - 'tests/test_dpip_privacy_observability_export.py'
      - 'cases/dtg-protected-access/current-openvtc-track-b-policy-ab.yaml'
      - 'cases/dtg-protected-access/dpip-runtime-evidence-contract.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-openvtc-track-b-policy-evidence.yml'
      - 'experiments/dtg-protected-access/current_openvtc_track_b_policy_context.py'
      - 'experiments/dtg-protected-access/capture_ab_runtime.py'
      - 'experiments/dtg-protected-access/export_dpip_evidence.py'
      - 'tests/test_dpip_privacy_observability_export.py'
      - 'cases/dtg-protected-access/current-openvtc-track-b-policy-ab.yaml'
      - 'cases/dtg-protected-access/dpip-runtime-evidence-contract.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENVTC_CHECKOUT: ${{ github.workspace }}/build/current-openvtc
      OPENVTC_REVISION: 72bf5794071971da506eb7a5af8e4765c35c137c
      DPIP_CHECKOUT: ${{ github.workspace }}/build/dpip-contract
      DPIP_REVISION: c31e3cb94dfe8d292dfd9277323983afacde5663
    steps:
      - name: Checkout Interop Lab producer
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install evidence dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Install VTI native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Checkout immutable OpenVTC target
        uses: actions/checkout@v7
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: 72bf5794071971da506eb7a5af8e4765c35c137c
          path: build/current-openvtc
          fetch-depth: 1
      - name: Checkout immutable DPIP contract
        uses: actions/checkout@v7
        with:
          repository: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
          ref: ${{ env.DPIP_REVISION }}
          path: build/dpip-contract
          fetch-depth: 1
      - name: Verify immutable pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$OPENVTC_CHECKOUT" rev-parse HEAD)" = "$OPENVTC_REVISION"
          test -z "$(git -C "$OPENVTC_CHECKOUT" status --porcelain)"
          test "$(git -C "$DPIP_CHECKOUT" rev-parse HEAD)" = "$DPIP_REVISION"
          test -z "$(git -C "$DPIP_CHECKOUT" status --porcelain)"
      - name: Execute target-native policy A/B observation
        run: |
          python experiments/dtg-protected-access/capture_ab_runtime.py \
            cases/dtg-protected-access/current-openvtc-track-b-policy-ab.yaml \
            --output "${{ runner.temp }}/current-openvtc-track-b-policy.yaml"
      - name: Verify attributable policy evidence
        run: |
          python - <<'PY'
          import pathlib, yaml
          doc=yaml.safe_load(pathlib.Path('${{ runner.temp }}/current-openvtc-track-b-policy.yaml').read_text())
          assert doc['provenance']['implementation_repository']=='OpenVTC/verifiable-trust-infrastructure'
          assert doc['provenance']['implementation_revision']=='72bf5794071971da506eb7a5af8e4765c35c137c'
          s=doc['requirements']['ER-STATUS-AB']['surfaces']
          assert s['policy_discovery_handle']['classification']=='fresh'
          assert s['policy_endpoint']['classification']=='fresh'
          assert s['policy_discovery_handle']['execution']['context_a']=='executed'
          assert s['policy_discovery_handle']['execution']['context_b']=='executed'
          assert doc['experiment']['observed_join']=='not-detected'
          PY
      - name: Verify target checkout restored clean
        shell: bash
        run: test -z "$(git -C "$OPENVTC_CHECKOUT" status --porcelain)"
      - name: Export DPIP evidence and privacy result
        run: |
          python experiments/dtg-protected-access/export_dpip_evidence.py \
            "${{ runner.temp }}/current-openvtc-track-b-policy.yaml" \
            --output "${{ runner.temp }}/current-openvtc-track-b-policy-provided-evidence.json" \
            --privacy-output "${{ runner.temp }}/current-openvtc-track-b-policy-privacy-observability.json" \
            --privacy-requirement ER-STATUS-AB \
            --privacy-surfaces policy_discovery_handle,policy_endpoint \
            --privacy-experiment-id track-b-policy-discovery-ab
      - name: Validate DPIP-owned privacy semantics
        run: |
          python "$DPIP_CHECKOUT/scripts/validate_privacy_observability_contract.py" \
            "${{ runner.temp }}/current-openvtc-track-b-policy-privacy-observability.json"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('${{ runner.temp }}/current-openvtc-track-b-policy-privacy-observability.json')
          doc=json.loads(p.read_text())
          assert doc['schema']=='dpip-privacy-observability-result/v1'
          assert doc['result']=='supported'
          assert doc['executed'] is True
          assert doc['correlation']['signal']=='not-found'
          assert 'deployment-wide unlinkability' in doc['unsupported_inference']
          assert 'terminal assurance PASS' in doc['unsupported_inference']
          PY
      - name: Upload attributable Track B policy evidence
        uses: actions/upload-artifact@v7
        with:
          name: current-openvtc-track-b-policy-runtime-upstream-observation
          path: |
            ${{ runner.temp }}/current-openvtc-track-b-policy.yaml
            ${{ runner.temp }}/current-openvtc-track-b-policy-provided-evidence.json
            ${{ runner.temp }}/current-openvtc-track-b-policy-privacy-observability.json
          if-no-files-found: error
