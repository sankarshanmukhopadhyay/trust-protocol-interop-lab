name: Current OpenVTC Track B task evidence

on:
  pull_request:
    paths:
      - '.github/workflows/current-openvtc-track-b-task-evidence.yml'
      - '.github/workflows/reusable-current-openvtc-ab-evidence.yml'
      - 'scripts/run_current_openvtc_ab_member.py'
      - 'evidence/workflow-characterization/current-openvtc-ab-family.yaml'
      - 'experiments/dtg-protected-access/current_openvtc_track_b_task_context.py'
      - 'experiments/dtg-protected-access/capture_ab_runtime.py'
      - 'experiments/dtg-protected-access/export_dpip_evidence.py'
      - 'cases/dtg-protected-access/current-openvtc-track-b-task-ab.yaml'
      - 'cases/dtg-protected-access/dpip-runtime-evidence-contract.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-openvtc-track-b-task-evidence.yml'
      - '.github/workflows/reusable-current-openvtc-ab-evidence.yml'
      - 'scripts/run_current_openvtc_ab_member.py'
      - 'evidence/workflow-characterization/current-openvtc-ab-family.yaml'
      - 'experiments/dtg-protected-access/current_openvtc_track_b_task_context.py'
      - 'experiments/dtg-protected-access/capture_ab_runtime.py'
      - 'experiments/dtg-protected-access/export_dpip_evidence.py'
      - 'cases/dtg-protected-access/current-openvtc-track-b-task-ab.yaml'
      - 'cases/dtg-protected-access/dpip-runtime-evidence-contract.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    uses: ./.github/workflows/reusable-current-openvtc-ab-evidence.yml
    with:
      member: track-b-task
      artifact_name: current-openvtc-track-b-task-runtime-upstream-observation
