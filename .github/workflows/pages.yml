name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate interoperability governance and evidence
        run: |
          python scripts/validate_catalog.py
          python scripts/validate_cases.py
          python experiments/xsp-001/run.py
          python experiments/xsp-002/run.py
          python experiments/arpa-a2a-anab/run.py
          python scripts/validate_evidence.py
          python scripts/validate_standards.py
          python scripts/validate_standards_v2.py
          python scripts/generate_standards.py
          python scripts/generate_readiness.py
          python scripts/check_links.py
          git diff --exit-code
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
