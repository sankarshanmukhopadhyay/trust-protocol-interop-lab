name: DTG action-vocabulary evidence

on:
  pull_request:
    paths:
      - 'cases/dtg-action-vocabulary/**'
      - 'experiments/dtg-action-vocabulary/**'
      - 'results/dtg-action-vocabulary/**'
      - '.github/workflows/dtg-action-vocabulary.yml'
  push:
    branches: [main]
    paths:
      - 'cases/dtg-action-vocabulary/**'
      - 'experiments/dtg-action-vocabulary/**'
      - 'results/dtg-action-vocabulary/**'
      - '.github/workflows/dtg-action-vocabulary.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python experiments/dtg-action-vocabulary/run.py --check
