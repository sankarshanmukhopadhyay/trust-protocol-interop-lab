name: DTG VDC VAC action-time composition evidence

on:
  pull_request:
    paths:
      - '.github/workflows/dtg-vdc-vac-action-time.yml'
      - 'experiments/dtg-vdc-vac-composition/run_action_time.py'
      - 'experiments/dtg-vdc-vac-composition/run.py'
      - 'cases/dtg-vdc-vac-composition/scenario.yaml'
      - 'experiments/protected-delegated-care/authority_boundary.py'
      - 'experiments/protected-delegated-care/run_authority_boundary.py'
      - 'experiments/protected-delegated-care/core.py'
      - 'tests/test_wd02_action_time_target_evidence.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-time-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DTG_CREDENTIALS_REVISION: 66376c01c1f56033cd9ba0775eb8ce0030ff038c
      DTG_CREDENTIALS_CHECKOUT: ${{ github.workspace }}/build/dtg-credentials
    steps:
      - name: Checkout Interop Lab
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install evidence dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Install native target dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Set up Rust required by target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - name: Checkout immutable clean-room credential target
        uses: actions/checkout@v7
        with:
          repository: OpenVTC/dtg-credentials
          ref: ${{ env.DTG_CREDENTIALS_REVISION }}
          path: build/dtg-credentials
          fetch-depth: 1
      - name: Verify immutable target pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$DTG_CREDENTIALS_CHECKOUT" rev-parse HEAD)" = "$DTG_CREDENTIALS_REVISION"
          test -z "$(git -C "$DTG_CREDENTIALS_CHECKOUT" status --porcelain)"
      # The immutable target does not commit Cargo.lock. The unconstrained
      # transitive resolve selected messaging-core 0.1.11, whose non-exhaustive
      # Inbound breaks messaging-sdk 0.22.0 (E0639). Reproduce the compatible
      # resolved epoch without changing tracked target sources.
      - name: Resolve and retain credential test dependency graph
        shell: bash
        run: |
          set -euo pipefail
          manifest="$DTG_CREDENTIALS_CHECKOUT/Cargo.toml"
          cargo generate-lockfile --manifest-path "$manifest"
          cargo update --manifest-path "$manifest" -p affinidi-messaging-core --precise 0.1.6
          python - <<'PY'
          import os, pathlib, tomllib
          lock = pathlib.Path(os.environ['DTG_CREDENTIALS_CHECKOUT']) / 'Cargo.lock'
          packages = tomllib.loads(lock.read_text())['package']
          versions = [p['version'] for p in packages if p['name'] == 'affinidi-messaging-core']
          assert versions == ['0.1.6'], f'unexpected affinidi-messaging-core versions: {versions}'
          PY
          sha256sum "$DTG_CREDENTIALS_CHECKOUT/Cargo.lock"
          test "$(git -C "$DTG_CREDENTIALS_CHECKOUT" rev-parse HEAD)" = "$DTG_CREDENTIALS_REVISION"
          test -z "$(git -C "$DTG_CREDENTIALS_CHECKOUT" status --porcelain)"
      - name: Execute credential target tests with resolved lockfile
        shell: bash
        run: cargo test --manifest-path "$DTG_CREDENTIALS_CHECKOUT/Cargo.toml" --locked --all-targets
      - name: Retain resolved dependency graph for reproducible validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: credential-target-resolved-cargo-lock
          path: ${{ github.workspace }}/build/dtg-credentials/Cargo.lock
          retention-days: 30
          if-no-files-found: warn
      - name: Record bounded target evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['DTG_CREDENTIALS_CHECKOUT'])
          revision=os.environ['DTG_CREDENTIALS_REVISION']
          # These observations are deliberately bounded to the exercised credential
          # component contract. They do not assert integrated action-time authority.
          result={
            'repository':'OpenVTC/dtg-credentials',
            'revision':revision,
            'cargo_test':'passed',
            'wd02_contract':{
              'digest_multibase':True,
              'proof_excluded_from_digest':True,
              'vac_parent_digest':True,
              'vdc_acceptance':True,
              'vdc_chain_verification':True,
              'valid_until_required':True,
            },
            'not_implemented':['integrated_trust_task_action_time_evaluator'],
            'claim_boundary':'Component runtime evidence only; integrated current-authority/action-effect and deployment policy/status remain separately evidenced.'
          }
          (Path(os.environ['RUNNER_TEMP'])/'wd02-dtg-credentials-target.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Validate evidence adapter contract
        run: python -m unittest tests.test_wd02_action_time_target_evidence
      - name: Execute action-time composition evidence
        run: |
          python experiments/dtg-vdc-vac-composition/run_action_time.py --target-evidence "${{ runner.temp }}/wd02-dtg-credentials-target.json" > "${{ runner.temp }}/wd02-action-time.json"
      - name: Verify target checkout remains attributable
        shell: bash
        run: test "$(git -C "$DTG_CREDENTIALS_CHECKOUT" rev-parse HEAD)" = "$DTG_CREDENTIALS_REVISION"
      - name: Upload action-time evidence
        uses: actions/upload-artifact@v7
        with:
          name: cleanroom-vdc-vac-action-time
          path: |
            ${{ runner.temp }}/wd02-dtg-credentials-target.json
            ${{ runner.temp }}/wd02-action-time.json
          if-no-files-found: error
