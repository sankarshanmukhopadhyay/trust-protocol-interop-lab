services:
  harness-adapter:
    build:
      context: ../dpac-agent-security
      dockerfile: Dockerfile.adapter
    environment:
      WORKSPACE_URL: http://workspace:8080
    ports:
      - "127.0.0.1:18080:8088"
    networks: [request_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [workspace]
